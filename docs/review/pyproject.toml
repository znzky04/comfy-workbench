[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "comfyui-agent-studio-review"
version = "0.1.0"
description = "Core source review snapshot with an offline contract example."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_agent_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
