name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository with web and test dependencies
        run: |
          python -m pip install "hatchling>=1.27" "editables>=0.5"
          python -m pip install --no-build-isolation -e ".[web,dev]"
      - name: Offline tests (no ComfyUI, models or private reference images)
        run: python -m pytest -q
      - name: Maintained source lint
        run: python -m ruff check src tests scripts examples
      - name: Offline usage example
        run: python examples/offline_review.py
      - name: Registered workflow static validation
        run: comfy-demo workflow validate --all
