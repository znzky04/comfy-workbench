[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "comfyui-agent-studio"
version = "0.1.0"
description = "A local-first, multi-client control plane for ComfyUI workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "pillow>=11,<13",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
comfy-demo = "comfyui_agent_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_agent_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
